name: Software Job Radar

on:
  # Public repositories have free standard GitHub-hosted runners. Offset from
  # the top of the hour to reduce GitHub schedule congestion.
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: software-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Find latest state artifact
        id: find_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("job-radar-state-"))) | [.created_at, .id] | @tsv' \
            | sort | tail -n 1 | cut -f 2)"
          if [[ -n "${artifact_id}" ]]; then
            echo "artifact_id=${artifact_id}" >> "${GITHUB_OUTPUT}"
            echo "Restoring state artifact ${artifact_id}"
          else
            echo "No previous state artifact; this is the initial scan"
          fi

      - name: Restore SQLite state
        if: steps.find_state.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.find_state.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          state_zip="$(mktemp)"
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${state_zip}"; then
            echo "State artifact ${ARTIFACT_ID} is unavailable; using the committed database seed"
            exit 0
          fi
          unzip -o "${state_zip}" -d data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_INTERVAL_MINUTES: "5"
          FETCH_WORKERS: "12"
          LOOKBACK_HOURS: "72"
          DB_PATH: data/jobs.sqlite3
          COMPANIES_PATH: config/companies.json
        run: python -m job_radar --once

      - name: Save SQLite state
        uses: actions/upload-artifact@v4
        with:
          name: job-radar-state-${{ github.run_id }}
          path: data/jobs.sqlite3
          if-no-files-found: error
          retention-days: 3

      - name: Remove older state artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_name="job-radar-state-${GITHUB_RUN_ID}"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and (.name | startswith(\"job-radar-state-\")) and .name != \"${current_name}\") | .id" \
            | while read -r artifact_id; do
                [[ -z "${artifact_id}" ]] || gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              done
